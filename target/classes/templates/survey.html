<!DOCTYPE html>
<html>

<head>
    <title>College Survey</title>
</head>

<body>

<h2>College Campus Survey</h2>

<form action="/submit" method="post">

    <label>Name:</label>
    <input type="text" name="name" required>

    <br><br>

    <label>Campus Rating:</label>
    <input type="number" name="rating" min="1" max="5" required>

    <br><br>

    <button type="submit">
        Submit
    </button>

</form>

</body>

</html>
